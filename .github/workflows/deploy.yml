name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: activitytracker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build application
        run: dotnet build ActivityTracker/ActivityTracker.csproj --configuration Release
      - name: Run scoring checks
        run: dotnet run --project tests/ScoringChecks --configuration Release
      - name: Build container
        run: docker build --tag activitytracker:ci ActivityTracker
      - name: Smoke test application and PostgreSQL
        env:
          APP_IMAGE: activitytracker:ci
          POSTGRES_PASSWORD: ci-only-disposable-database-password
          ALLOWED_HOSTS: localhost;127.0.0.1
        run: |
          docker compose --env-file /dev/null -f compose.production.yml up -d --wait --wait-timeout 180
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/ | grep -q 'Morning Challenge'
      - name: Remove disposable smoke test database
        if: always()
        env:
          APP_IMAGE: activitytracker:ci
          POSTGRES_PASSWORD: ci-only-disposable-database-password
          ALLOWED_HOSTS: localhost;127.0.0.1
        run: docker compose --env-file /dev/null -f compose.production.yml down --volumes
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested source
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ActivityTracker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy exact image digest with pinned SSH host identity
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_IMAGE: ${{ needs.publish.outputs.image }}
          RELEASE: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$APP_IMAGE" =~ ^ghcr\.io/revuimar/activitytracker@sha256:[a-f0-9]{64}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh-keygen -y -f "$key" > /dev/null
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=20)
          destination="$SSH_USER@$SSH_HOST"
          remote="/opt/activitytracker/releases/$RELEASE"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "mkdir -p '$remote'"
          scp "${opts[@]}" -P "$SSH_PORT" compose.production.yml deploy/deploy.sh "$destination:$remote/"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "bash '$remote/deploy.sh' '$RELEASE' '$APP_IMAGE'"
