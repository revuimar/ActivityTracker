services:
  app:
    build: ./ActivityTracker
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-activitytracker};Username=${POSTGRES_USER:-tracker};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Admin__ParticipantId: ${ADMIN_PARTICIPANT_ID:-0}
      Strava__ClientId: ${STRAVA_CLIENT_ID:-}
      Strava__ClientSecret: ${STRAVA_CLIENT_SECRET:-}
      Strava__RedirectUri: ${STRAVA_REDIRECT_URI:-http://localhost:8080/auth/strava/callback}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activitytracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-activitytracker}"]
      interval: 5s
      retries: 15
volumes:
  postgres_data:
